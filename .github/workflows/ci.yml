name: CI

on:
  push:
    branches: [dev, stg, prd]
  pull_request:
    branches: [dev, stg, prd]
  workflow_dispatch:   # "Run workflow" button in the Actions tab (on prd it also re-deploys)

permissions:
  contents: read
  actions: read   # the "tested" job looks up earlier runs of this workflow

# a newer push to the same branch cancels the checks that are still running (never a deploy in progress, see below)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prd' }}

jobs:
  # A merge of stg into prd usually holds exactly the files that already passed every check on stg (and in the pull
  # request). Then the checks below are skipped and the deploy starts at once. Any other change on prd, or a merge whose
  # files differ from the tested commit, runs every check first.
  tested:
    name: Earlier green run of the same code
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.find.outputs.skip }}
    steps:
      - name: Check out the code
        if: github.ref == 'refs/heads/prd' && github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      - name: Look for a green run of a commit with the same files
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          ON_PRD: ${{ github.ref == 'refs/heads/prd' && github.event_name != 'pull_request' }}
        run: |
          skip=false
          if [ "$ON_PRD" = true ]; then
            tree=$(git rev-parse 'HEAD^{tree}')
            # the merged stg commit (second parent of a merge), or this commit itself (a manual re-deploy)
            for c in $(git rev-parse -q --verify 'HEAD^2' || true) "$(git rev-parse HEAD)"; do
              [ "$(git rev-parse "$c^{tree}")" = "$tree" ] || continue
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$c&status=success&per_page=50" \
                --jq "[.workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .id != $GITHUB_RUN_ID)] | length")
              if [ "${n:-0}" -gt 0 ]; then
                skip=true
                echo "Commit $c has the same files and a green CI run: the checks are skipped." >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
          fi
          [ "$skip" = true ] || echo "No earlier green run of the same files: every check runs." >> "$GITHUB_STEP_SUMMARY"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  commits:
    name: Conventional Commits
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Check new commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # first push of a branch (before = 000…), manual run, or rewritten history: no range to check
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no range of new commits to check"; exit 0
          fi
          tools/check_commit.sh "$BASE..$HEAD"

  python:
    name: Python tests
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: pyproject.toml }
      - name: Install the package with test, S3 and Kafka extras
        run: pip install -e ".[test,s3,kafka]"
      - name: Run pytest (unit, API, ingest, architecture rules)
        run: python -m pytest -q

  web:
    name: Web UI build
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build the web UI
        run: npm run build
        working-directory: web
      - name: Check that the Indonesian and English dictionaries match
        run: node tools/check_i18n.mjs
      - name: Run the formatter tests
        run: node --test tests/test_format.mjs tests/test_state.mjs tests/test_collectors.mjs tests/test_servers.mjs tests/test_i18n_case.mjs

  caddy:
    name: Caddy configuration
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      # The same image, entrypoint and mounts as the https service of docker-compose.yml, with every optional file switched
      # on (ingest site, Cloudflare-only guard, JSON access log) and then with all of them off.
      - name: Validate the Caddy configuration with every option on
        run: |
          docker run --rm -e DOCKER_DOMAIN=monishield.example.com -e DOCKER_ACME_EMAIL=admin@example.com \
            -e DOCKER_INGEST_DOMAIN=ingest.example.com -e DOCKER_MAIN_CLOUDFLARE_ONLY=1 -e DOCKER_ACCESS_LOG=1 \
            -v "$PWD/deploy/Caddyfile.letsencrypt:/etc/caddy/Caddyfile:ro" -v "$PWD/deploy/caddy:/etc/caddy/extra:ro" \
            --entrypoint sh caddy:2.10.2-alpine /etc/caddy/extra/entrypoint.sh validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate the Caddy configuration with every option off
        run: |
          docker run --rm -e DOCKER_DOMAIN=monishield.example.com -e DOCKER_ACME_EMAIL=admin@example.com -e DOCKER_ACCESS_LOG=0 \
            -v "$PWD/deploy/Caddyfile.letsencrypt:/etc/caddy/Caddyfile:ro" -v "$PWD/deploy/caddy:/etc/caddy/extra:ro" \
            --entrypoint sh caddy:2.10.2-alpine /etc/caddy/extra/entrypoint.sh validate --config /etc/caddy/Caddyfile --adapter caddyfile

  browser:
    name: Browser smoke test
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: pyproject.toml }
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install the package
        run: pip install -e ".[test]"
      - name: Build the web UI
        run: npm ci && npm run build
        working-directory: web
      - name: Install Playwright and Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
        working-directory: web
      - name: Start a server with sample S3, Kafka and collector data
        run: |
          python tools/smoke_server.py "$RUNNER_TEMP/smoke" 8777 > "$RUNNER_TEMP/smoke-server.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8777/api/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/smoke-server.log"; exit 1
      - name: Open every page for all sources and both languages
        run: NODE_PATH=web/node_modules node tools/smoke_browser.cjs http://127.0.0.1:8777
      - name: Show the server log
        if: failure()
        run: cat "$RUNNER_TEMP/smoke-server.log"

  deploy:
    name: Deploy to the production server
    # only the prd branch, only after every check above passed or was skipped because the same files already passed
    # ("tested" job); pull requests never deploy
    if: >-
      !cancelled() && github.ref == 'refs/heads/prd' && github.event_name != 'pull_request' &&
      needs.tested.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [tested, commits, python, web, caddy, browser]
    runs-on: ubuntu-latest
    environment: production   # Settings -> Environments -> production: secrets below, optional required reviewers
    concurrency: { group: deploy-production, cancel-in-progress: false }
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Check that the deploy secrets are set
        run: |
          missing=""
          for v in HOST DEPLOY_USER SSH_KEY KNOWN_HOSTS; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Deploy secrets not set:$missing (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS; see docs/07-deploy-vps.md §13)"
            exit 1
          fi
      - name: Set up the SSH key and the server's host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull, build and restart on the server
        # each setting may be an environment variable or an environment secret
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '/srv/MoniShield' }}
          DEPLOY_PROFILES: ${{ vars.DEPLOY_PROFILES || secrets.DEPLOY_PROFILES || 'https' }}
          DEPLOY_MIGRATE_FROM: ${{ vars.DEPLOY_MIGRATE_FROM || secrets.DEPLOY_MIGRATE_FROM }}
          DEPLOY_REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          remote_env=$(printf 'DEPLOY_DIR=%q DEPLOY_BRANCH=prd DEPLOY_SHA=%q DEPLOY_PROFILES=%q DEPLOY_MIGRATE_FROM=%q DEPLOY_REPO=%q' \
            "$DEPLOY_DIR" "$GITHUB_SHA" "$DEPLOY_PROFILES" "$DEPLOY_MIGRATE_FROM" "$DEPLOY_REPO")
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "$remote_env bash -s" < deploy/remote-deploy.sh
