name: CI

on:
  push:
    branches: [dev, stg, prd, master]
  pull_request:
    branches: [dev, stg, prd]

permissions:
  contents: read

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Periksa pesan commit baru
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # push pertama sebuah branch (before = 000…) atau sejarah yang ditulis ulang: tidak ada rentang untuk diperiksa
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "tidak ada rentang commit baru untuk diperiksa"; exit 0
          fi
          tools/cek_commit.sh "$BASE..$HEAD"

  python:
    name: Uji Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[test,s3,kafka]"
      - run: python -m pytest -q

  web:
    name: Build tampilan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node tools/cek_i18n.mjs
