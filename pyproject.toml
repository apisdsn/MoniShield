[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monishield"
version = "2.0.0"
description = "SIMPEL4 log dashboard (v2): ingest into DuckDB, FastAPI API, Svelte UI"
requires-python = ">=3.12"  # csv.QUOTE_NOTNULL (parse.py)
dependencies = [
    "duckdb>=1.1,<2",       # storage and queries
    "fastapi>=0.110,<1",    # API and static files
    "uvicorn>=0.29,<1",     # server ASGI
    "sqlalchemy>=2.0,<3",   # ORM for accounts, sessions, audit (PostgreSQL on the server; SQLite for tests/local)
    "psycopg[binary]>=3.1,<4",  # driver PostgreSQL
    "pyjwt>=2.8,<3",        # JWT session tokens (HS256)
    "cryptography>=42",     # ECDH + AES-GCM for encrypted API bodies (monishield/infrastructure/wirecrypto.py)
]

[project.optional-dependencies]
test = [
    "pytest>=8",   # runs the tests
    "httpx>=0.27", # needed by the FastAPI test client
]
s3 = [
    "boto3>=1.34", # import from an S3 prefix (Stage 19); only ListObjectsV2 and GetObject
]
kafka = [
    "kafka-python>=2.0.2,<4", # logs from Kafka (Rancher cluster logging); pure Python, supports SASL PLAIN/SCRAM and SSL
]

[tool.setuptools.packages.find]
include = ["monishield*"]   # clean architecture layers: domain, application, infrastructure, interfaces

[tool.setuptools.package-data]
"monishield.domain" = ["crs_rules.json", "capec.json", "CRS-LICENSE.txt"]
"monishield.infrastructure" = ["schema.sql"]
"monishield.infrastructure.derive" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
