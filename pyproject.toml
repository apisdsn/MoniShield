[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpel4"
version = "2.0.0"
description = "Dashboard log SIMPEL4 (v2): ingest ke DuckDB, API FastAPI, tampilan Svelte"
requires-python = ">=3.12"  # csv.QUOTE_NOTNULL (parse.py)
dependencies = [
    "duckdb>=1.1,<2",       # penyimpanan dan query
    "fastapi>=0.110,<1",    # API dan berkas statis
    "uvicorn>=0.29,<1",     # server ASGI
    "sqlalchemy>=2.0,<3",   # ORM untuk akun, sesi, audit (PostgreSQL di server; SQLite untuk uji/lokal)
    "psycopg[binary]>=3.1,<4",  # driver PostgreSQL
    "pyjwt>=2.8,<3",        # token sesi JWT (HS256)
]

[project.optional-dependencies]
test = [
    "pytest>=8",   # menjalankan uji
    "httpx>=0.27", # dibutuhkan klien uji FastAPI
]
s3 = [
    "boto3>=1.34", # impor dari awalan S3 (Tahap 19); hanya ListObjectsV2 dan GetObject
]

[tool.setuptools]
packages = ["simpel4", "simpel4.derive", "simpel4.api"]

[tool.setuptools.package-data]
simpel4 = ["schema.sql", "derive/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
