# Salin menjadi config.toml (opsional). Semua kunci punya nilai bawaan = perilaku sistem lama.
# Variabel lingkungan S4_* menimpa isi berkas ini. Rahasia (sandi admin, token, kunci AWS) HANYA lewat
# variabel lingkungan / .env, jangan ditulis di sini.

# log_dir   = "/path/ke/folder-log"   # S4_LOG_DIR; bawaan: folder induk v2/
# data_dir  = "data"                  # S4_DATA_DIR
# cache_dir = "/path/ke/.cache"       # S4_CACHE_DIR; bawaan: <log_dir>/.cache
# state_dir = "data"                  # S4_STATE_DIR (auth.db)
# inbox_dir = "data/inbox"            # S4_INBOX_DIR
# bind = "127.0.0.1:8000"             # S4_BIND
# ingest_on_start = true              # S4_INGEST_ON_START
# cookie_secure = true                # S4_COOKIE_SECURE; false hanya untuk lokal tanpa HTTPS

