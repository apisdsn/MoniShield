# Copy to config.toml (optional). Every key has a default = the old system's behavior.
# S4_* environment variables override this file. Secrets (admin password, tokens, AWS keys) ONLY through
# environment variables / .env, never write them here.

# log_dir   = "/path/ke/folder-log"   # S4_LOG_DIR; default: the parent folder of v2/
# data_dir  = "data"                  # S4_DATA_DIR
# cache_dir = "/path/ke/.cache"       # S4_CACHE_DIR; default: <log_dir>/.cache
# state_dir = "data"                  # S4_STATE_DIR (auth.db)
# inbox_dir = "data/inbox"            # S4_INBOX_DIR
# bind = "127.0.0.1:8000"             # S4_BIND
# ingest_on_start = true              # S4_INGEST_ON_START
# cookie_secure = true                # S4_COOKIE_SECURE; false only for local use without HTTPS

